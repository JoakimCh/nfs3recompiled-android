plugins {
     id 'com.android.application'
     id 'org.jetbrains.kotlin.plugin.compose'
}

// Fork releases keep their installed identity regardless of selected ABI.
// The legacy armv7Tv flag remains an alias for existing local commands.
def armv7Tv = providers.gradleProperty("armv7Tv").isPresent()
def forkBuild = armv7Tv || providers.gradleProperty("forkRelease").isPresent()
def gameAbis = providers.gradleProperty("gameAbis")
        .orElse(armv7Tv ? "armeabi-v7a" : "arm64-v8a").get().split(',').toList()
if (gameAbis.isEmpty() || gameAbis.toSet().size() != gameAbis.size()
        || !gameAbis.every { it in ['armeabi-v7a', 'arm64-v8a'] }) {
    throw new GradleException("gameAbis must select armeabi-v7a, arm64-v8a, or both")
}
def gamePrecision = providers.gradleProperty("gamePrecision").orElse("DOUBLE").get()
if (!(gamePrecision in ["DOUBLE", "SINGLE"])) {
    throw new GradleException("gamePrecision must be DOUBLE or SINGLE")
}
def profileNative = providers.gradleProperty("profileNative").isPresent()
// Launcher tests deliberately avoid installing/configuring the native toolchain.
def launcherTestsOnly = providers.gradleProperty("launcherTestsOnly").isPresent()
def nativeJobs = providers.gradleProperty("nativeJobs").orElse("2").get().toInteger()
if (nativeJobs < 1) throw new GradleException("nativeJobs must be positive")
if (launcherTestsOnly && gradle.startParameter.taskNames.any {
    !(it in [':app:testReleaseUnitTest', 'testReleaseUnitTest'])
}) {
    throw new GradleException("launcherTestsOnly is restricted to testReleaseUnitTest; APK/native builds must include native libraries.")
}
def toolchain = rootProject.ext.nfsToolchain
def forkRelease = rootProject.ext.nfsRelease
if (gameAbis.contains("armeabi-v7a") && (providers.gradleProperty("x87Exact").isPresent()
        || providers.gradleProperty("wideFpu").isPresent())) {
    throw new GradleException("The ARMv7 TV build uses the default double-backed FPU.")
}

android {
    testBuildType = "release"
    namespace = "dev.nfs3hp.port"
    // Shared with workspace setup, CI and signing.
    compileSdk = toolchain.compileSdk as int
    buildToolsVersion = toolchain.buildTools
    ndkVersion = toolchain.ndk

    defaultConfig {
        applicationId = "dev.nfs3hp.port"
        if (forkBuild) applicationIdSuffix = ".armv7tv"
        /* Android 8.0.  The floor is java.nio.file, which the launcher reads
         * and writes the game's files with: it arrived in API 26, and going
         * lower would mean desugaring the library and rewriting that.  Nothing
         * else in the app needs more: calls above 26 are guarded by their
         * level -- window metrics and insets in AndroidWindowCompat and
         * TouchPreviewFrame (30), the vibrator manager in GameHaptics (31),
         * the centred glyph span in withControlIcons (29) -- and the native
         * side asks nothing of the platform that NDK 28 does not cover from
         * API 21 on, as SDL3 itself does. */
        minSdk = 26
        targetSdk = toolchain.targetSdk as int
        // ARMv7 identity is shared with signing; profiling is a separate capability.
        versionCode = forkBuild ? (forkRelease.versionCode as int) : 78
        versionName = forkBuild ? forkRelease.versionName : "0.78"
        testInstrumentationRunner "dev.nfs3hp.port.TouchOverlayInstrumentation"
        resValue "string", "game_precision", gamePrecision
        // Filter both packaging and native compilation: Compose also supplies
        // libraries for ABIs for which we do not build the game.
        ndk {
            abiFilters.addAll(gameAbis)
        }
        manifestPlaceholders = [nativeProfileable: profileNative.toString(), gamePrecision: gamePrecision, launcherAppLabel: forkBuild ? "NFS III" : "@string/app_name"]

        if (!launcherTestsOnly) {
            externalNativeBuild {
                cmake {
                    /* AGP compiles the debug variant with no -O flag at all, so
                     * clang defaults to -O0.  For ~60 MB of generated virtual-CPU
                     * code that is the difference between a playable frame rate and
                     * something that feels interpreted; the desktop reference build
                     * is Release.  This lands after CMAKE_CXX_FLAGS_DEBUG, so it
                     * wins, while -g is kept for symbolicating native crashes. */
                    cppFlags "-O2 -ffp-contract=off"
                    arguments(
                        "-DCMAKE_JOB_POOLS=nfs_compile=${nativeJobs};nfs_link=1",
                        "-DCMAKE_JOB_POOL_COMPILE=nfs_compile",
                        "-DCMAKE_JOB_POOL_LINK=nfs_link",
                        "-DANDROID_STL=c++_shared",
                        // The game pumps SDL's event queue from a guest thread, so
                        // SDL_assert(SDL_IsMainThread()) inside SDL_PumpEvents fires
                        // on every single pump. SDL_HINT_ASSERT only suppresses the
                        // dialog -- the assertion machinery itself still runs, and a
                        // simpleperf profile put SDL_ReportAssertion at ~1% of total
                        // CPU. "release" keeps the cheap assertions and drops that one.
                        "-DSDL_ASSERTIONS=release",
                        // MMX is retained only in the reference checks upstream.
                        "-DWITH_MMX=OFF",
                        "-DNFS_GAME_PRECISION=${gamePrecision}"
                    )
                    // Only nfs3hp is wired up for Android (see the NFS_BUILD_NFS2SE
                    // guard in the root CMakeLists.txt); the default is already OFF.
                    abiFilters.addAll(gameAbis)
                }
            }
        }
    }

    buildTypes {
        /* The only build: the one players get and the one tested.  The
         * launcher's Debug screen is what tells the two apart -- with debug
         * mode off nothing is written to the log (AppLog, NFS_LOG) and the
         * game starts as a player has it.  Signed afterwards: zipalign -p 4,
         * then apksigner (APK/README.md). */
        release {
            debuggable = false
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose = true
        buildConfig = false
        resValues = true
    }

    if (!launcherTestsOnly) {
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version = toolchain.cmake
            }
        }
    }

    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--enable-native-access=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // The launcher's screens: Compose with Material 3, in the game's own colours.
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
}

