// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    def toolchain = new groovy.json.JsonSlurper().parse(file('../tools/android-toolchain.json'))
    rootProject.ext.nfsToolchain = toolchain
    rootProject.ext.nfsRelease = new groovy.json.JsonSlurper().parse(file('../tools/android-release.json'))
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${toolchain.agp}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${toolchain.kotlin}"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${toolchain.kotlin}"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
