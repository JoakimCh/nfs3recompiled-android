name: Android checks and builds
run-name: ARMv7 ${{ inputs.mode }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        required: true
        default: tests
        options:
          - tests
          - check
          - apk
permissions:
  contents: read
concurrency:
  group: armv7-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NFS_BUILD_CACHE: ${{ github.workspace }}/.nfs3-cache
      ANDROID_HOME: ${{ github.workspace }}/.nfs3-cache/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.nfs3-cache/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
      NFS_ANDROID_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read selected JDK
        id: toolchain
        run: python3 -c 'import json,os; c=json.load(open("tools/android-toolchain.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("jdk="+str(c["jdk"])+"\n")'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}
      - name: Cache Gradle and launcher test dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .gradle-cache/caches
            .gradle-cache/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('tools/android-toolchain.json', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-
      - name: Cache selected Android tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .nfs3-cache
          key: ${{ runner.os }}-${{ runner.arch }}-android-v1-${{ inputs.mode == 'tests' && 'launcher' || 'native' }}-${{ hashFiles('tools/android-toolchain.json') }}
      - name: Cache pinned SDL source
        if: inputs.mode != 'tests'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: third_party/SDL
          key: ${{ runner.os }}-sdl-v1-${{ hashFiles('tools/android-toolchain.json') }}
      - name: Verify original signing credentials before building
        if: inputs.mode == 'apk'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/android.py verify-signing --github-secrets
      - name: Run selected checks or build
        run: |
          args=("$NFS_ANDROID_MODE" --accept-sdk-licenses --jobs 2)
          if [ "$NFS_ANDROID_MODE" = apk ]; then args+=(--unsigned); fi
          python3 tools/android.py "${args[@]}"
      - name: Sign and verify APK
        if: inputs.mode == 'apk'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/android.py sign --github-secrets
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: armv7-${{ inputs.mode }}-reports
          path: |
            android/app/build/test-results/testReleaseUnitTest/
            android/app/build/reports/tests/testReleaseUnitTest/
            out/validation.json
            out/apk-resource-check.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save signed APK and verification
        if: inputs.mode == 'apk'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: armv7-apk
          path: |
            out/nfs3-*.apk
            out/*-release.json
            out/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Save exact native symbols separately
        if: inputs.mode == 'apk'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: armv7-native-symbols
          path: out/*-symbols.zip
          if-no-files-found: error
          retention-days: 90
