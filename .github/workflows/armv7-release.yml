name: Android checks and builds
run-name: ${{ inputs.target }} ${{ inputs.mode }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target (both creates one universal APK)
        type: choice
        required: true
        default: both
        options:
          - armv7
          - armv8
          - both
      mode:
        description: What to run (apk-fast skips tests)
        type: choice
        required: true
        default: tests
        options:
          - tests
          - check
          - apk
          - apk-fast
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ inputs.target }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NFS_BUILD_CACHE: ${{ github.workspace }}/.nfs3-cache
      ANDROID_HOME: ${{ github.workspace }}/.nfs3-cache/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.nfs3-cache/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
      NFS_ANDROID_TARGET: ${{ inputs.target }}
      NFS_ANDROID_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read selected JDK
        id: toolchain
        run: python3 -c 'import json,os; c=json.load(open("tools/android-toolchain.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("jdk="+str(c["jdk"])+"\n")'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}
      - name: Cache Gradle and launcher test dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .gradle-cache/caches
            .gradle-cache/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('tools/android-toolchain.json', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-
      - name: Cache selected Android tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .nfs3-cache
          key: ${{ runner.os }}-${{ runner.arch }}-android-v1-${{ inputs.mode == 'tests' && 'launcher' || 'native' }}-${{ hashFiles('tools/android-toolchain.json') }}
      - name: Cache pinned SDL source
        if: inputs.mode != 'tests'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: third_party/SDL
          key: ${{ runner.os }}-sdl-v1-${{ hashFiles('tools/android-toolchain.json') }}
      - name: Verify original signing credentials before building
        if: inputs.mode == 'apk' || inputs.mode == 'apk-fast'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/android.py verify-signing --github-secrets
      - name: Run selected checks or build
        run: |
          args=("$NFS_ANDROID_MODE" --target "$NFS_ANDROID_TARGET" --accept-sdk-licenses --jobs 2)
          if [[ "$NFS_ANDROID_MODE" = apk || "$NFS_ANDROID_MODE" = apk-fast ]]; then args+=(--unsigned); fi
          python3 tools/android.py "${args[@]}"
      - name: Sign and verify APK
        if: inputs.mode == 'apk' || inputs.mode == 'apk-fast'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/android.py sign --target "$NFS_ANDROID_TARGET" --github-secrets
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target }}-${{ inputs.mode }}-reports
          path: |
            android/app/build/test-results/testReleaseUnitTest/
            android/app/build/reports/tests/testReleaseUnitTest/
            out/validation.json
            out/apk-resource-check.json
          if-no-files-found: ignore
          archive: true
          retention-days: 14
      - name: Save signed APK and verification
        if: inputs.mode == 'apk' || inputs.mode == 'apk-fast'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target }}-apk
          path: |
            out/nfs3-*.apk
            out/*-release.json
            out/validation.json
          if-no-files-found: error
          archive: true
          retention-days: 14
      - name: Save exact native symbols separately
        if: inputs.mode == 'apk' || inputs.mode == 'apk-fast'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target }}-native-symbols
          path: out/*-symbols.zip
          if-no-files-found: error
          archive: true
          retention-days: 90


