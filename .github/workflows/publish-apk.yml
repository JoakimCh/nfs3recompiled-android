name: Publish APK release
run-name: Publish ${{ inputs.target }} ${{ inputs.release_type }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target of the existing build
        type: choice
        required: true
        default: both
        options:
          - armv7
          - armv8
          - both
      build_branch:
        description: Build branch (blank uses the selected workflow branch)
        type: string
        required: false
      run_id:
        description: APK run ID (apk or apk-fast; blank uses the latest successful signed build on that branch)
        type: string
        required: false
      release_type:
        description: Publish as a prerelease or regular release
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - release
permissions:
  contents: read
concurrency:
  group: publish-android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish existing verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_BUILD_BRANCH: ${{ inputs.build_branch || github.ref_name }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 tools/release/publish_android.py

